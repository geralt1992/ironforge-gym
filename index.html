<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRONFORGE — Premium Fitness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e6c96a;
      --dark: #080808;
      --dark2: #111111;
      --dark3: #1a1a1a;
      --gray: #2a2a2a;
      --text: #e8e8e8;
      --muted: #888;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text);
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--dark); }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 0 5%;
      display: flex; align-items: center; justify-content: space-between;
      height: 72px;
      transition: background 0.4s, backdrop-filter 0.4s, border-bottom 0.4s;
    }
    nav.scrolled {
      background: rgba(8,8,8,0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(201,168,76,0.15);
    }
    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.9rem;
      letter-spacing: 3px;
      color: var(--gold);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      color: var(--text); text-decoration: none;
      font-size: 0.85rem; font-weight: 500; letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: var(--gold); }
    .nav-cta {
      background: var(--gold); color: #000;
      padding: 0.6rem 1.6rem; border-radius: 2px;
      font-weight: 700; font-size: 0.8rem; letter-spacing: 1.5px;
      text-transform: uppercase; text-decoration: none;
      transition: background 0.3s, transform 0.2s;
    }
    .nav-cta:hover { background: var(--gold-light); transform: translateY(-1px); }

    /* ── HERO ── */
    #hero {
      position: relative; height: 100vh; min-height: 700px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background-image: url('https://images.pexels.com/photos/1552242/pexels-photo-1552242.jpeg?auto=compress&cs=tinysrgb&w=1920&h=1080&dpr=1');
      background-size: cover; background-position: center 30%;
      filter: brightness(0.35);
      transform: scale(1.05);
      animation: heroZoom 12s ease-out forwards;
    }
    @keyframes heroZoom { to { transform: scale(1); } }
    .hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(8,8,8,0.6) 0%, transparent 60%, rgba(201,168,76,0.08) 100%);
    }
    .hero-content {
      position: relative; text-align: center; padding: 0 1rem;
      animation: fadeUp 1s ease 0.3s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-eyebrow {
      display: inline-block;
      font-size: 0.75rem; letter-spacing: 5px; text-transform: uppercase;
      color: var(--gold); font-weight: 600;
      margin-bottom: 1.2rem;
    }
    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(4rem, 12vw, 9rem);
      line-height: 0.9; letter-spacing: 4px;
      color: #fff;
      margin-bottom: 1.5rem;
    }
    .hero-title span { color: var(--gold); }
    .hero-sub {
      font-size: 1.05rem; color: rgba(232,232,232,0.7);
      max-width: 480px; margin: 0 auto 2.5rem;
      line-height: 1.7; font-weight: 300;
    }
    .hero-btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      background: var(--gold); color: #000;
      padding: 1rem 2.5rem; border-radius: 2px;
      font-weight: 700; font-size: 0.85rem; letter-spacing: 2px;
      text-transform: uppercase; text-decoration: none; border: none; cursor: pointer;
      transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
    }
    .btn-primary:hover {
      background: var(--gold-light); transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(201,168,76,0.4);
    }
    .btn-outline {
      background: transparent; color: #fff;
      padding: 1rem 2.5rem; border-radius: 2px;
      font-weight: 600; font-size: 0.85rem; letter-spacing: 2px;
      text-transform: uppercase; text-decoration: none; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.3);
      transition: border-color 0.3s, color 0.3s, transform 0.2s;
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }
    .hero-scroll {
      position: absolute; bottom: 2.5rem; left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      color: var(--muted); font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
      animation: bounce 2s infinite;
    }
    .hero-scroll-line {
      width: 1px; height: 50px;
      background: linear-gradient(to bottom, var(--gold), transparent);
    }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(8px); }
    }

    /* ── STATS BAR ── */
    .stats-bar {
      background: var(--gold);
      padding: 0;
      display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .stat-item {
      padding: 1.8rem 1rem; text-align: center;
      border-right: 1px solid rgba(0,0,0,0.15);
    }
    .stat-item:last-child { border-right: none; }
    .stat-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem; line-height: 1; color: #000;
    }
    .stat-label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: rgba(0,0,0,0.65);
      margin-top: 0.3rem;
    }

    /* ── SECTION UTILS ── */
    section { padding: 7rem 5%; }
    .section-tag {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 4px;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 0.8rem;
    }
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      letter-spacing: 2px; line-height: 1;
      margin-bottom: 1.2rem;
    }
    .section-sub {
      color: var(--muted); font-size: 1rem; line-height: 1.8;
      max-width: 520px; font-weight: 300;
    }
    .divider {
      width: 60px; height: 3px;
      background: linear-gradient(to right, var(--gold), transparent);
      margin: 1.5rem 0;
    }

    /* ── ABOUT ── */
    #about { background: var(--dark2); }
    .about-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6rem;
      align-items: center; max-width: 1200px; margin: 0 auto;
    }
    .about-images {
      position: relative; height: 560px;
    }
    .about-img-main {
      position: absolute; top: 0; left: 0;
      width: 75%; height: 82%;
      object-fit: cover; border-radius: 2px;
    }
    .about-img-accent {
      position: absolute; bottom: 0; right: 0;
      width: 52%; height: 46%;
      object-fit: cover; border-radius: 2px;
      border: 4px solid var(--dark2);
    }
    .about-badge {
      position: absolute; bottom: 12%; left: 5%;
      background: var(--gold); color: #000;
      padding: 1.2rem 1.5rem; border-radius: 2px;
      text-align: center;
    }
    .about-badge-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem; line-height: 1;
    }
    .about-badge-text {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .about-features { display: flex; flex-direction: column; gap: 1.5rem; margin-top: 2rem; }
    .about-feature {
      display: flex; gap: 1rem; align-items: flex-start;
      padding: 1.2rem; background: var(--dark3); border-radius: 4px;
      border-left: 3px solid var(--gold);
      transition: transform 0.3s;
    }
    .about-feature:hover { transform: translateX(6px); }
    .about-feature-icon {
      font-size: 1.5rem; flex-shrink: 0; margin-top: 2px;
    }
    .about-feature h4 {
      font-size: 0.9rem; font-weight: 700; letter-spacing: 1px;
      margin-bottom: 0.3rem; color: #fff;
    }
    .about-feature p { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }

    /* ── PROGRAMS ── */
    #programs { background: var(--dark); }
    .programs-header {
      text-align: center; max-width: 600px; margin: 0 auto 4rem;
    }
    .programs-header .divider { margin: 1.5rem auto; }
    .programs-header .section-sub { margin: 0 auto; }
    .programs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5px;
      max-width: 1200px; margin: 0 auto;
      background: var(--gray);
    }
    .program-card {
      position: relative; overflow: hidden;
      aspect-ratio: 3/4; cursor: pointer;
      background: var(--dark3);
    }
    .programs-grid > div:first-child { grid-row: span 2; min-height: 500px; }
    .programs-grid > div:first-child .program-card { height: 100%; aspect-ratio: auto; }
    .program-img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease, filter 0.6s ease;
      filter: brightness(0.5);
    }
    .program-card:hover .program-img { transform: scale(1.08); filter: brightness(0.3); }
    .program-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 60%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 2rem;
      transition: background 0.4s;
    }
    .program-tag {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem;
    }
    .program-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem; letter-spacing: 2px; color: #fff;
      margin-bottom: 0.5rem;
    }
    .program-desc {
      font-size: 0.82rem; color: rgba(232,232,232,0.65); line-height: 1.6;
      max-height: 0; overflow: hidden;
      transition: max-height 0.5s ease, opacity 0.5s ease;
      opacity: 0;
    }
    .program-card:hover .program-desc { max-height: 100px; opacity: 1; }
    .program-arrow {
      display: inline-flex; align-items: center; gap: 0.5rem;
      color: var(--gold); font-size: 0.78rem; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; margin-top: 1rem;
      opacity: 0; transform: translateX(-10px);
      transition: opacity 0.4s, transform 0.4s;
    }
    .program-card:hover .program-arrow { opacity: 1; transform: translateX(0); }

    /* ── PRICING ── */
    #pricing { background: var(--dark2); }
    .pricing-header { text-align: center; max-width: 600px; margin: 0 auto 4rem; }
    .pricing-header .divider { margin: 1.5rem auto; }
    .pricing-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem; max-width: 1100px; margin: 0 auto;
    }
    .pricing-card {
      background: var(--dark3); border-radius: 4px;
      padding: 2.5rem 2rem;
      border: 1px solid var(--gray);
      position: relative; overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    }
    .pricing-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .pricing-card.featured {
      border-color: var(--gold);
      background: linear-gradient(135deg, #1a1500 0%, var(--dark3) 50%);
    }
    .pricing-card.featured::before {
      content: 'MOST POPULAR';
      position: absolute; top: 1.2rem; right: -2.2rem;
      background: var(--gold); color: #000;
      font-size: 0.6rem; font-weight: 800; letter-spacing: 2px;
      padding: 0.3rem 3rem;
      transform: rotate(45deg);
    }
    .pricing-name {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 3px;
      text-transform: uppercase; color: var(--gold); margin-bottom: 1rem;
    }
    .pricing-price {
      display: flex; align-items: flex-start; gap: 0.3rem;
      margin-bottom: 0.5rem;
    }
    .pricing-currency {
      font-size: 1.2rem; font-weight: 700; color: var(--gold); margin-top: 0.8rem;
    }
    .pricing-amount {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4.5rem; line-height: 1; color: #fff;
    }
    .pricing-period {
      font-size: 0.8rem; color: var(--muted); align-self: flex-end; margin-bottom: 0.5rem;
    }
    .pricing-desc {
      font-size: 0.82rem; color: var(--muted); margin-bottom: 2rem; line-height: 1.6;
    }
    .pricing-features { list-style: none; margin-bottom: 2rem; }
    .pricing-features li {
      display: flex; align-items: center; gap: 0.8rem;
      font-size: 0.85rem; padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      color: rgba(232,232,232,0.8);
    }
    .pricing-features li::before {
      content: '✓'; color: var(--gold); font-weight: 700; flex-shrink: 0;
    }
    .pricing-features li.disabled { opacity: 0.3; }
    .pricing-features li.disabled::before { content: '✗'; color: var(--muted); }

    /* ── GALLERY ── */
    #gallery { background: var(--dark); padding: 5rem 0; }
    .gallery-header {
      text-align: center; padding: 0 5% 3rem; max-width: 600px; margin: 0 auto;
    }
    .gallery-header .divider { margin: 1.5rem auto; }
    .gallery-strip {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr 1.5fr;
      gap: 4px;
    }
    .gallery-item {
      overflow: hidden; aspect-ratio: 3/4; position: relative;
    }
    .gallery-item:first-child, .gallery-item:last-child { aspect-ratio: 2/3; }
    .gallery-img {
      width: 100%; height: 100%; object-fit: cover;
      filter: brightness(0.7) saturate(0.8);
      transition: filter 0.4s, transform 0.5s;
    }
    .gallery-item:hover .gallery-img {
      filter: brightness(1) saturate(1.1);
      transform: scale(1.05);
    }

    /* ── TESTIMONIALS ── */
    #testimonials { background: var(--dark2); }
    .testimonials-header { text-align: center; margin-bottom: 4rem; }
    .testimonials-header .divider { margin: 1.5rem auto; }
    .testimonials-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem; max-width: 1200px; margin: 0 auto;
    }
    .testimonial-card {
      background: var(--dark3); border-radius: 4px;
      padding: 2rem; border: 1px solid var(--gray);
      position: relative;
      transition: transform 0.3s, border-color 0.3s;
    }
    .testimonial-card:hover { transform: translateY(-4px); border-color: rgba(201,168,76,0.3); }
    .testimonial-quote {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 5rem; line-height: 0.5; color: var(--gold); opacity: 0.3;
      margin-bottom: 1rem;
    }
    .testimonial-text {
      font-size: 0.9rem; color: rgba(232,232,232,0.75);
      line-height: 1.8; margin-bottom: 1.5rem; font-style: italic;
    }
    .testimonial-stars { color: var(--gold); font-size: 0.9rem; margin-bottom: 1rem; }
    .testimonial-author { display: flex; align-items: center; gap: 1rem; }
    .testimonial-avatar {
      width: 48px; height: 48px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--gold);
    }
    .testimonial-name { font-weight: 700; font-size: 0.9rem; }
    .testimonial-role { font-size: 0.75rem; color: var(--muted); }

    /* ── CTA ── */
    #cta {
      position: relative; padding: 8rem 5%;
      text-align: center; overflow: hidden;
    }
    .cta-bg {
      position: absolute; inset: 0;
      background-image: url('https://images.pexels.com/photos/841130/pexels-photo-841130.jpeg?auto=compress&cs=tinysrgb&w=1920&h=800&dpr=1');
      background-size: cover; background-position: center 40%;
      background-attachment: fixed;
      filter: brightness(0.2);
    }
    .cta-overlay {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(201,168,76,0.1) 0%, rgba(8,8,8,0.7) 70%);
    }
    .cta-content { position: relative; max-width: 700px; margin: 0 auto; }
    .cta-content .section-title { font-size: clamp(3rem, 8vw, 6rem); }
    .cta-content .section-sub { margin: 1rem auto 2.5rem; font-size: 1.1rem; }
    .cta-content .divider { margin: 1.5rem auto; }

    /* ── CONTACT ── */
    #contact { background: var(--dark); }
    .contact-grid {
      display: grid; grid-template-columns: 1fr 1.2fr;
      gap: 5rem; max-width: 1100px; margin: 0 auto; align-items: start;
    }
    .contact-info { }
    .contact-item {
      display: flex; gap: 1.2rem; align-items: flex-start;
      margin-bottom: 2rem;
    }
    .contact-icon {
      width: 48px; height: 48px; border-radius: 2px;
      background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0;
    }
    .contact-item h4 { font-weight: 700; font-size: 0.9rem; margin-bottom: 0.3rem; }
    .contact-item p { font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
    .contact-form { display: flex; flex-direction: column; gap: 1rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--muted);
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      background: var(--dark3); border: 1px solid var(--gray);
      color: var(--text); padding: 0.9rem 1rem;
      border-radius: 2px; font-family: 'Inter', sans-serif;
      font-size: 0.9rem; outline: none;
      transition: border-color 0.3s;
      resize: none;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--gold); }
    .form-group input::placeholder,
    .form-group textarea::placeholder { color: #444; }
    .form-group select option { background: var(--dark3); }

    /* ── FOOTER ── */
    footer {
      background: var(--dark2);
      border-top: 1px solid var(--gray);
    }
    .footer-top {
      padding: 4rem 5%;
      display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 3rem; max-width: 1300px; margin: 0 auto;
    }
    .footer-brand .nav-logo { display: inline-block; margin-bottom: 1rem; }
    .footer-brand p { font-size: 0.85rem; color: var(--muted); line-height: 1.8; max-width: 280px; }
    .footer-socials { display: flex; gap: 0.8rem; margin-top: 1.5rem; }
    .social-btn {
      width: 38px; height: 38px; border-radius: 2px;
      background: var(--dark3); border: 1px solid var(--gray);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; text-decoration: none; color: var(--muted);
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }
    .social-btn:hover { background: var(--gold); border-color: var(--gold); color: #000; }
    .footer-col h4 {
      font-size: 0.72rem; font-weight: 800; letter-spacing: 3px;
      text-transform: uppercase; color: var(--gold); margin-bottom: 1.5rem;
    }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 0.8rem; }
    .footer-col a {
      color: var(--muted); text-decoration: none; font-size: 0.85rem;
      transition: color 0.3s;
    }
    .footer-col a:hover { color: var(--gold); }
    .footer-bottom {
      border-top: 1px solid var(--gray);
      padding: 1.5rem 5%;
      display: flex; align-items: center; justify-content: space-between;
      max-width: 1300px; margin: 0 auto;
    }
    .footer-bottom p { font-size: 0.78rem; color: var(--muted); }

    /* ── SCROLL ANIMATIONS ── */
    .reveal {
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.from-left  { transform: translateX(-60px); }
    .reveal.from-right { transform: translateX(60px); }
    .reveal.scale-in   { transform: scale(0.88); }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0) translateX(0) scale(1);
    }

    /* stagger delays */
    .stagger-1 { transition-delay: 0.1s; }
    .stagger-2 { transition-delay: 0.2s; }
    .stagger-3 { transition-delay: 0.3s; }
    .stagger-4 { transition-delay: 0.4s; }
    .stagger-5 { transition-delay: 0.5s; }

    /* gold line draw on section entrance */
    .divider-anim {
      width: 0; height: 3px;
      background: linear-gradient(to right, var(--gold), transparent);
      margin: 1.5rem 0;
      transition: width 0.9s ease 0.3s;
    }
    .divider-anim.visible { width: 60px; }

    function useReveal(options = {}) {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            el.classList.add('visible');
            obs.unobserve(el);
          }
        }, { threshold: options.threshold || 0.15, ...options });
        obs.observe(el);
        return () => obs.disconnect();
      }, []);
      return ref;
    }

    /* ─── Animated number counter ─── */
    function AnimatedNumber({ target, suffix = '' }) {
      const [display, setDisplay] = useState('0');
      const ref = useRef(null);
      const started = useRef(false);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting && !started.current) {
            started.current = true;
            const numTarget = parseFloat(target.replace(/[^0-9.]/g, ''));
            const prefix = target.match(/^[^0-9]*/)[0];
            const isFloat = target.includes('.');
            const duration = 1800;
            const start = performance.now();
            const tick = (now) => {
              const p = Math.min((now - start) / duration, 1);
              const eased = 1 - Math.pow(1 - p, 3);
              const val = eased * numTarget;
              setDisplay(prefix + (isFloat ? val.toFixed(1) : Math.floor(val)) + suffix);
              if (p < 1) requestAnimationFrame(tick);
              else setDisplay(target + suffix);
            };
            requestAnimationFrame(tick);
            obs.unobserve(el);
          }
        }, { threshold: 0.5 });
        obs.observe(el);
        return () => obs.disconnect();
      }, [target, suffix]);
      return <span ref={ref} className="ticker">{display}</span>;
    }

                <li><a href="#">7:00 – 22:00</a></li>
                <li><a href="#">Sunday</a></li>
                <li><a href="#">8:00 – 20:00</a></li>
              </ul>
            </div>
          </div>
          <div style={{maxWidth:"1300px",margin:"0 auto"}}>
            <div className="footer-bottom">
              <p>© 2026 IRONFORGE Premium Fitness. All rights reserved.</p>
              <p>Privacy Policy · Terms of Service · Cookie Policy</p>
            </div>
          </div>
        </footer>
      );
    }

    function App() {
      const [scrollPct, setScrollPct] = useState(0);
      const [cursor, setCursor] = useState({ x: -999, y: -999 });

      useEffect(() => {
        const onScroll = () => {
          const el = document.documentElement;
          setScrollPct((el.scrollTop / (el.scrollHeight - el.clientHeight)) * 100);
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        return () => window.removeEventListener('scroll', onScroll);
      }, []);

      useEffect(() => {
        const onMove = (e) => setCursor({ x: e.clientX, y: e.clientY });
        window.addEventListener('mousemove', onMove);
        return () => window.removeEventListener('mousemove', onMove);
      }, []);

      useEffect(() => {
        const onClick = (e) => {
          for (let i = 0; i < 8; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = e.clientX + (Math.random() * 40 - 20) + 'px';
            p.style.top  = e.clientY + (Math.random() * 40 - 20) + 'px';
            p.style.animationDelay = (Math.random() * 0.3) + 's';
            p.style.width = p.style.height = (Math.random() * 4 + 2) + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 3200);
          }
        };
        window.addEventListener('click', onClick);
        return () => window.removeEventListener('click', onClick);
      }, []);

      return (
        <>
          <div className="scroll-progress" style={{ width: scrollPct + '%' }} />
          <div className="cursor-glow" style={{ left: cursor.x, top: cursor.y }} />
          <Nav />
          <Hero />
          <StatsBar />
          <About />
          <Programs />
          <Pricing />
          <Gallery />
          <Testimonials />
          <CTA />
          <Contact />
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
